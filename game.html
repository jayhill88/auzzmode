<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 CHAOS STICKMAN RACE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0f;
  font-family:'Segoe UI',sans-serif;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
  overflow-x:hidden;
}
h1 {
  font-size:2.2rem;
  font-weight:900;
  background:linear-gradient(90deg,#f59e0b,#ef4444,#a855f7,#3b82f6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.subtitle { color:#666; font-size:0.85rem; margin-bottom:14px; }

/* PICK */
#pick-screen { text-align:center; margin-bottom:12px; }
#pick-screen h2 { font-size:1rem; color:#aaa; margin-bottom:10px; }
.pick-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.pick-btn {
  padding:8px 16px; border-radius:50px; border:2px solid;
  background:#111; font-weight:700; cursor:pointer;
  font-size:0.9rem; transition:all 0.15s; color:#fff;
}
.pick-btn:hover { transform:scale(1.08); }
.pick-btn.selected { background:rgba(255,255,255,0.12); transform:scale(1.1); box-shadow:0 0 14px currentColor; }

/* TRACK AREA */
#track-area {
  width:100%; max-width:840px;
  background:#0d0d1a;
  border:2px solid #222;
  border-radius:20px;
  overflow:hidden;
  padding:10px 0;
}
.lane-wrap {
  display:flex;
  align-items:center;
  height:72px;
  margin:3px 0;
}
.lane-label {
  width:82px; min-width:82px;
  padding-left:10px;
  font-size:0.76rem; font-weight:700;
  display:flex; flex-direction:column; gap:2px;
  z-index:2;
}
.lane-rank { font-size:0.62rem; color:#555; font-weight:400; }
.your-pick-tag { font-size:0.6rem; color:#F59E0B; font-weight:700; }
.lane-canvas-wrap {
  flex:1; height:100%; position:relative; overflow:hidden;
}
canvas.lane-canvas {
  display:block; width:100%; height:100%;
}

/* COMMENTARY */
#commentary {
  width:100%; max-width:840px;
  min-height:34px; margin-top:8px;
  background:#111; border-radius:10px;
  padding:7px 14px; font-size:0.9rem;
  font-weight:600; color:#F59E0B; text-align:center;
  border:1px solid #222;
}

/* PROGRESS BAR */
#progress-bar-wrap {
  width:100%; max-width:840px;
  background:#111; border-radius:10px;
  padding:8px 14px; margin-top:6px;
  border:1px solid #222;
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
}
.progress-runner {
  display:flex; align-items:center; gap:4px;
  font-size:0.75rem; font-weight:700;
  flex:1; min-width:100px;
}
.progress-bar-bg {
  flex:1; height:6px; background:#222; border-radius:3px; overflow:hidden;
}
.progress-bar-fill {
  height:100%; border-radius:3px; transition:width 0.1s;
}

/* COUNTDOWN */
#countdown {
  font-size:5.5rem; font-weight:900; color:#F59E0B;
  min-height:90px; display:flex; align-items:center; justify-content:center;
  text-shadow:0 0 40px #F59E0B88;
}

/* CONTROLS */
#controls { margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.btn-start {
  background:linear-gradient(135deg,#F59E0B,#f97316);
  color:#000; border:none; padding:13px 40px;
  border-radius:50px; font-size:1.05rem; font-weight:900;
  cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;
  transition:transform 0.1s;
}
.btn-start:hover { transform:scale(1.05); }
.btn-start:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.btn-reset {
  background:#1a1a2e; color:#fff; border:1px solid #333;
  padding:13px 24px; border-radius:50px;
  font-size:0.95rem; font-weight:700; cursor:pointer;
}
.btn-reset:hover { background:#222; }

/* LEGEND */
#legend {
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  margin-top:10px; font-size:0.75rem; color:#555;
}

/* WINNER */
#winner-banner {
  display:none; margin-top:14px;
  padding:18px 36px; border-radius:18px;
  font-size:1.5rem; font-weight:900; text-align:center;
  animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  max-width:840px; width:100%;
}
@keyframes popIn {
  from { transform:scale(0.3); opacity:0; }
  to { transform:scale(1); opacity:1; }
}

/* CONFETTI */
#confetti-container {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:999; overflow:hidden;
}
.confetti-piece {
  position:absolute; border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform:translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
}
</style>
</head>
<body>

<h1>💥 CHAOS STICKMAN RACE</h1>
<p class="subtitle">Banana peels · Missiles · Paintballs · Explosions · Total chaos</p>

<div id="pick-screen">
  <h2>🎯 Pick your stickman</h2>
  <div class="pick-row" id="pick-row"></div>
</div>

<div id="countdown"></div>

<div id="track-area"></div>

<div id="progress-bar-wrap"></div>
<div id="commentary">Pick your stickman and smash START! 💥</div>

<div id="controls">
  <button class="btn-start" id="startBtn" onclick="startRace()">💥 START CHAOS!</button>
  <button class="btn-reset" onclick="resetRace()">↺ Reset</button>
</div>

<div id="legend">
  <span>🍌 Banana = slip + slide back</span>
  <span>🚀 Missile = explosion + knockback</span>
  <span>🎨 Paintball = blinded + slowed</span>
  <span>❄️ Ice = uncontrolled slide</span>
  <span>⚡ Lightning = zap + stun</span>
</div>

<div id="winner-banner"></div>
<div id="confetti-container"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────
const TRACK_LENGTH = 3200;   // world units
const FINISH_POS   = 3100;
const VIEW_W       = 700;    // canvas logical width
const VIEW_H       = 72;
const STICK_W      = 46;
const STICK_H      = 56;

const RUNNERS_DEF = [
  { name:'Red',    color:'#ef4444', emoji:'🔴' },
  { name:'Blue',   color:'#3b82f6', emoji:'🔵' },
  { name:'Green',  color:'#22c55e', emoji:'🟢' },
  { name:'Yellow', color:'#eab308', emoji:'🟡' },
  { name:'Purple', color:'#a855f7', emoji:'🟣' },
  { name:'Orange', color:'#f97316', emoji:'🟠' },
];

// Obstacle types
const OBS = {
  BANANA:    { emoji:'🍌', w:28, h:22 },
  MISSILE:   { emoji:'🚀', w:36, h:24 },
  PAINTBALL: { emoji:'🎨', w:24, h:24 },
  ICE:       { emoji:'❄️', w:50, h:16 },
  LIGHTNING: { emoji:'⚡', w:24, h:36 },
};

const COMMENTS = {
  lead:      [r=>`🔥 ${r.emoji} ${r.name} is CRUSHING IT!`, r=>`⚡ ${r.name.toUpperCase()} IN THE LEAD!`, r=>`😤 Nobody's catching ${r.name}!`],
  boost:     [r=>`💨 ${r.name} hits TURBO!`, r=>`⚡ SPEED BOOST for ${r.emoji}!`],
  banana:    [r=>`🍌 ${r.emoji} ${r.name} HIT A BANANA PEEL! 😂`, r=>`💀 ${r.name} slipped on a banana — CLASSIC!`],
  missile:   [r=>`🚀 MISSILE INCOMING for ${r.emoji} ${r.name}!! 💥`, r=>`💥 ${r.name} just got BLASTED into next week!`],
  paintball: [r=>`🎨 ${r.emoji} ${r.name} got SPLATTERED with paint!`, r=>`🔵 ${r.name} can't see through all that paint!`],
  ice:       [r=>`❄️ ${r.emoji} ${r.name} hit an ICE PATCH — sliding out of control!`],
  lightning: [r=>`⚡ ZAP! ${r.emoji} ${r.name} got struck by LIGHTNING!`, r=>`💀 ${r.name} got ZAPPED — the smell alone...`],
  close:     [()=>`👀 THIS IS NECK AND NECK!!`, ()=>`😤 IT'S TOO CLOSE TO CALL!`],
  pick_win:  [r=>`🎉 YES! ${r.emoji} ${r.name} is WINNING — that's YOUR PICK!`],
  pick_lose: [r=>`💪 Come on ${r.emoji} ${r.name}, FIGHT BACK!`],
};

// ─── STATE ────────────────────────────────────────────────────────
let runners = [];
let obstacles = [];   // { lane, worldX, type, hit:bool, animFrame:0 }
let effects = [];     // { lane, worldX, type, frame, maxFrame }
let picked = null;
let raceStarted = false;
let raceFinished = false;
let animFrameId = null;
let frameN = 0;
let commentCD = 0;
let cameraX = 0;      // world X of left edge of view
let finishedCount = 0;

// ─── AUDIO ────────────────────────────────────────────────────────
let audioCtx = null;
function beep(freq, dur, vol=0.25, type='square') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e){}
}
function explosion() { beep(80,0.3,0.4,'sawtooth'); setTimeout(()=>beep(60,0.4,0.3,'sawtooth'),100); }
function zapSound()  { beep(1200,0.05,0.3); setTimeout(()=>beep(400,0.2,0.2,'sawtooth'),50); }
function splat()     { beep(300,0.1,0.2,'triangle'); setTimeout(()=>beep(200,0.15,0.15),80); }

// ─── BUILD UI ─────────────────────────────────────────────────────
function buildPicks() {
  const row = document.getElementById('pick-row');
  row.innerHTML = '';
  RUNNERS_DEF.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'pick-btn';
    btn.style.color = r.color;
    btn.style.borderColor = r.color;
    btn.textContent = r.emoji + ' ' + r.name;
    btn.onclick = () => {
      picked = i;
      document.querySelectorAll('.pick-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      setComment(`Riding with ${r.emoji} ${r.name}! May the chaos be with you 💥`);
    };
    row.appendChild(btn);
  });
}

function buildTrack() {
  const area = document.getElementById('track-area');
  area.innerHTML = '';
  const pbWrap = document.getElementById('progress-bar-wrap');
  pbWrap.innerHTML = '';
  finishedCount = 0;

  runners = RUNNERS_DEF.map((r, i) => ({
    ...r, index: i,
    x: 0,
    speed: 0,
    baseSpeed: 1.4 + Math.random() * 0.9,
    finished: false,
    finishRank: null,
    // Status effects
    effect: null,    // 'banana','missile','paintball','ice','lightning','boost'
    effectFrames: 0,
    effectCooldown: 0,
    boostCooldown: 0,
    iceVel: 0,
    paintAlpha: 0,
    // Canvas
    canvas: null,
    ctx: null,
    rankEl: null,
    pbFill: null,
  }));

  runners.forEach((r, i) => {
    // Lane row
    const wrap = document.createElement('div');
    wrap.className = 'lane-wrap';
    wrap.id = `lane-${i}`;

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'lane-label';
    lbl.style.color = r.color;
    lbl.innerHTML = `<span>${r.emoji} ${r.name}${picked===i ? '<br><span class="your-pick-tag">★ YOU</span>':''}</span>`;
    const rankEl = document.createElement('span');
    rankEl.className = 'lane-rank';
    rankEl.id = `rank-${i}`;
    lbl.appendChild(rankEl);
    r.rankEl = rankEl;

    // Canvas
    const cWrap = document.createElement('div');
    cWrap.className = 'lane-canvas-wrap';
    const cv = document.createElement('canvas');
    cv.className = 'lane-canvas';
    cv.width = VIEW_W; cv.height = VIEW_H;
    cWrap.appendChild(cv);
    wrap.appendChild(lbl);
    wrap.appendChild(cWrap);
    area.appendChild(wrap);
    r.canvas = cv;
    r.ctx = cv.getContext('2d');

    // Progress bar
    const pbRunner = document.createElement('div');
    pbRunner.className = 'progress-runner';
    pbRunner.innerHTML = `<span style="color:${r.color}">${r.emoji}</span>`;
    const bg = document.createElement('div'); bg.className='progress-bar-bg';
    const fill = document.createElement('div');
    fill.className='progress-bar-fill';
    fill.style.background = r.color;
    fill.style.width = '0%';
    bg.appendChild(fill);
    pbRunner.appendChild(bg);
    pbWrap.appendChild(pbRunner);
    r.pbFill = fill;
  });

  generateObstacles();
}

function generateObstacles() {
  obstacles = [];
  const types = Object.keys(OBS);
  // Place obstacles throughout the track
  for (let lane = 0; lane < 6; lane++) {
    // 8-14 obstacles per lane, spread across the track
    const count = 8 + Math.floor(Math.random() * 7);
    for (let j = 0; j < count; j++) {
      const worldX = 300 + Math.floor(Math.random() * (FINISH_POS - 400));
      const type = types[Math.floor(Math.random() * types.length)];
      obstacles.push({ lane, worldX, type, hit: false, animFrames: 0 });
    }
  }
}

// ─── DRAWING ──────────────────────────────────────────────────────
function drawLane(r, camX) {
  const ctx = r.ctx;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);

  // Track background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Track surface
  ctx.fillStyle = '#161625';
  ctx.fillRect(0, VIEW_H*0.55, VIEW_W, VIEW_H*0.45);

  // Dashed center line
  ctx.strokeStyle = '#ffffff18';
  ctx.lineWidth = 1;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H * 0.82);
  ctx.lineTo(VIEW_W, VIEW_H * 0.82);
  ctx.stroke();
  ctx.setLineDash([]);

  // Km markers
  ctx.fillStyle = '#ffffff22';
  ctx.font = '9px monospace';
  for (let m = 200; m < TRACK_LENGTH; m += 200) {
    const sx = m - camX;
    if (sx > -20 && sx < VIEW_W + 20) {
      ctx.fillText(`${m}m`, sx - 8, VIEW_H - 4);
      ctx.fillStyle = '#ffffff15';
      ctx.fillRect(sx - 1, VIEW_H * 0.55, 2, 8);
      ctx.fillStyle = '#ffffff22';
    }
  }

  // Finish line
  const finishSX = FINISH_POS - camX;
  if (finishSX > -10 && finishSX < VIEW_W + 10) {
    // Checkerboard
    ctx.fillStyle = '#fff';
    for (let ty = 0; ty < VIEW_H; ty += 8) {
      for (let tx = 0; tx < 12; tx += 8) {
        if ((Math.floor(ty/8) + Math.floor(tx/8)) % 2 === 0) {
          ctx.fillRect(finishSX + tx - 6, ty, 8, 8);
        }
      }
    }
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('FINISH', finishSX - 2, 12);
  }

  // Obstacles
  obstacles.filter(o => o.lane === r.index && !o.hit).forEach(o => {
    const sx = o.worldX - camX;
    if (sx > -40 && sx < VIEW_W + 40) {
      ctx.font = OBS[o.type].h + 'px serif';
      ctx.fillText(OBS[o.type].emoji, sx - OBS[o.type].w/2, VIEW_H * 0.72);
    }
  });

  // Hit effects still animating
  effects.filter(e => e.lane === r.index).forEach(e => {
    const sx = e.worldX - camX;
    const prog = e.frame / e.maxFrame;
    if (e.type === 'explosion') {
      const radius = prog * 45;
      ctx.beginPath();
      ctx.arc(sx, VIEW_H/2, radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,${120+Math.random()*80},0,${(1-prog)*0.7})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx, VIEW_H/2, radius*0.5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,100,${(1-prog)*0.9})`;
      ctx.fill();
    } else if (e.type === 'splat') {
      const splatEmojis = ['🔵','🟡','🔴','🟢','🟣'];
      ctx.font = `${(1-prog*0.5)*32}px serif`;
      ctx.globalAlpha = 1 - prog;
      ctx.fillText(splatEmojis[e.lane % splatEmojis.length], sx - 16, VIEW_H/2 + 8);
      ctx.globalAlpha = 1;
    } else if (e.type === 'zap') {
      ctx.strokeStyle = `rgba(255,255,0,${(1-prog)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let z = 0; z < 5; z++) {
        ctx.moveTo(sx + (Math.random()-0.5)*30, 0);
        ctx.lineTo(sx + (Math.random()-0.5)*20, VIEW_H);
      }
      ctx.stroke();
    }
    e.frame++;
  });

  // Stickman
  const stickSX = r.x - camX;
  if (!r.finished) {
    drawStickman(ctx, r.color, stickSX, VIEW_H, frameN, r.effect, r.effectFrames, r.paintAlpha);
  } else {
    // At finish — draw a small trophy
    ctx.font = '28px serif';
    const finX = FINISH_POS - camX + 10;
    ctx.fillText(['🥇','🥈','🥉','🏅','🏅','🏅'][r.finishRank-1], finX, VIEW_H*0.7);
  }
}

function drawStickman(ctx, color, sx, laneH, frame, effect, efFrames, paintAlpha) {
  const ground = laneH * 0.82;
  const cx = sx + STICK_W/2;

  if (effect === 'banana' || effect === 'missile') {
    // Fallen/exploded — draw on ground
    ctx.save();
    ctx.translate(cx, ground - 8);
    ctx.rotate(Math.PI/2 + (effect==='missile' ? Math.sin(frame*0.3)*0.3 : 0));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -16, 6, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(0,4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(-10+Math.sin(frame*0.2)*4, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(10-Math.sin(frame*0.2)*4, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(-8+Math.cos(frame*0.2)*5, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(8-Math.cos(frame*0.2)*5, 14); ctx.stroke();
    ctx.restore();
    ctx.font='16px serif'; ctx.fillText(effect==='missile'?'💥':'⭐', cx+8, ground-28);
    return;
  }

  if (effect === 'lightning') {
    // Zapped — stiff arms up
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    const y0 = ground - 46;
    ctx.beginPath(); ctx.arc(cx, y0+8, 6, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(cx,y0+14); ctx.lineTo(cx,y0+30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y0+18); ctx.lineTo(cx-14,y0+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y0+18); ctx.lineTo(cx+14,y0+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y0+30); ctx.lineTo(cx-9,y0+44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y0+30); ctx.lineTo(cx+9,y0+44); ctx.stroke();
    ctx.font='12px serif'; ctx.fillText('⚡⚡', cx-10, y0);
    return;
  }

  const isIce = effect === 'ice';
  const isBoosting = effect === 'boost';
  const speed = isBoosting ? 0.55 : isIce ? 0.15 : 0.3;
  const legSwing = Math.sin(frame * speed) * 14;
  const armSwing = Math.sin(frame * speed) * 10;
  const bob = Math.abs(Math.sin(frame * speed)) * 2;
  const y0 = ground - 46 - bob;

  // Speed lines for boost
  if (isBoosting) {
    ctx.strokeStyle = color + '55';
    ctx.lineWidth = 1.5;
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(cx-26-i*4, y0+12+i*8);
      ctx.lineTo(cx-8, y0+12+i*8);
      ctx.stroke();
    }
  }

  // Ice slide effect
  if (isIce) {
    ctx.fillStyle = '#88ccff22';
    ctx.beginPath();
    ctx.ellipse(cx, ground, 22, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 2.8;
  ctx.lineCap = 'round';

  // Paint overlay
  if (paintAlpha > 0) {
    ctx.globalAlpha = Math.min(0.7, paintAlpha * 0.7);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(cx-14, y0-4, 28, 52);
    ctx.globalAlpha = 1;
  }

  ctx.beginPath(); ctx.arc(cx, y0+8, 6, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y0+14); ctx.lineTo(cx,y0+32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y0+20); ctx.lineTo(cx-10+armSwing,y0+28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y0+20); ctx.lineTo(cx+10-armSwing,y0+28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y0+32); ctx.lineTo(cx-8+legSwing,y0+46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y0+32); ctx.lineTo(cx+8-legSwing,y0+46); ctx.stroke();
}

// ─── PHYSICS ──────────────────────────────────────────────────────
function updateRunner(r) {
  if (r.finished) return;

  // Effect tick
  if (r.effectFrames > 0) r.effectFrames--;
  else r.effect = null;
  if (r.effectCooldown > 0) r.effectCooldown--;
  if (r.boostCooldown > 0) r.boostCooldown--;

  // Movement based on effect
  if (r.effect === 'banana') {
    r.x -= 0.8; // slide back
    r.x = Math.max(0, r.x);
  } else if (r.effect === 'missile') {
    r.x -= 1.2; // blasted back
    r.x = Math.max(0, r.x);
  } else if (r.effect === 'lightning') {
    // frozen
  } else if (r.effect === 'ice') {
    r.iceVel = Math.min(r.iceVel + 0.15, r.baseSpeed * 2.5);
    r.x += r.iceVel;
  } else {
    r.iceVel = 0;
    const isBoosting = r.effect === 'boost';
    const surge = Math.sin(frameN * 0.04 + r.index * 1.7) * 0.5;
    const noise = (Math.random()-0.5)*0.4;
    const mult = isBoosting ? 2.3 : 1;
    r.speed = Math.max(0.2, (r.baseSpeed + surge + noise) * mult);
    r.x += r.speed;

    // Random boost
    if (!isBoosting && r.boostCooldown === 0 && Math.random() < 0.004) {
      r.effect = 'boost';
      r.effectFrames = 45 + Math.floor(Math.random()*25);
      r.boostCooldown = 220;
      commentEvent('boost', r);
    }
  }

  // Paint fade
  if (r.paintAlpha > 0) r.paintAlpha = Math.max(0, r.paintAlpha - 0.005);

  // Check finish
  if (r.x >= FINISH_POS) {
    r.x = FINISH_POS;
    r.finished = true;
    finishedCount++;
    r.finishRank = finishedCount;
    r.rankEl.textContent = ['🥇1st','🥈2nd','🥉3rd','4th','5th','6th'][finishedCount-1];
    if (finishedCount === 1) {
      beep(880,0.1); setTimeout(()=>beep(1100,0.1),120); setTimeout(()=>beep(1320,0.3),240);
    }
  }
}

function checkObstacles() {
  obstacles.forEach(o => {
    if (o.hit) return;
    const r = runners[o.lane];
    if (r.finished || r.effectCooldown > 0) return;
    const rCenter = r.x + STICK_W/2;
    const dist = Math.abs(rCenter - o.worldX);
    if (dist < 22) {
      o.hit = true;
      applyObstacle(r, o);
    }
  });
}

function applyObstacle(r, o) {
  r.effectCooldown = 180;
  commentEvent(o.type.toLowerCase(), r);

  switch(o.type) {
    case 'BANANA':
      r.effect = 'banana'; r.effectFrames = 55;
      beep(300,0.1,'triangle'); beep(200,0.15,'triangle');
      addEffect(r.index, o.worldX, 'splat', 30);
      break;
    case 'MISSILE':
      r.effect = 'missile'; r.effectFrames = 80;
      explosion();
      addEffect(r.index, o.worldX, 'explosion', 40);
      break;
    case 'PAINTBALL':
      r.paintAlpha = 1; r.effectFrames = 100; r.effect = 'paintball';
      splat();
      r.baseSpeed *= 0.75; // slow down
      setTimeout(() => { r.baseSpeed /= 0.75; }, 5000);
      addEffect(r.index, o.worldX, 'splat', 35);
      break;
    case 'ICE':
      r.effect = 'ice'; r.effectFrames = 90; r.iceVel = r.speed * 1.2;
      beep(800,0.1,'sine'); beep(600,0.2,'sine');
      break;
    case 'LIGHTNING':
      r.effect = 'lightning'; r.effectFrames = 65;
      zapSound();
      addEffect(r.index, o.worldX, 'zap', 25);
      break;
  }
}

function addEffect(lane, worldX, type, maxFrame) {
  effects.push({ lane, worldX, type, frame: 0, maxFrame });
}

// ─── COMMENTARY ───────────────────────────────────────────────────
function commentEvent(type, r) {
  const arr = COMMENTS[type];
  if (!arr) return;
  const fn = arr[Math.floor(Math.random()*arr.length)];
  setComment(fn(r));
  commentCD = 80;
}

function setComment(text) {
  document.getElementById('commentary').textContent = text;
}

function updateCommentary() {
  commentCD--;
  if (commentCD > 0) return;
  const ranked = [...runners].sort((a,b) => b.x - a.x);
  const leader = ranked[0];
  if (!leader || leader.finished) return;
  const close = ranked.length>1 && (ranked[0].x - ranked[1].x) < 60 && ranked[0].x > FINISH_POS*0.5;

  if (close && Math.random()<0.04) {
    const arr = COMMENTS.close;
    setComment(arr[Math.floor(Math.random()*arr.length)]());
    commentCD = 70;
  } else if (picked !== null && !runners[picked].finished && Math.random()<0.02) {
    const pr = runners[picked];
    const isWin = ranked[0].index === picked;
    const arr = isWin ? COMMENTS.pick_win : COMMENTS.pick_lose;
    setComment(arr[Math.floor(Math.random()*arr.length)](pr));
    commentCD = 100;
  } else if (Math.random()<0.015) {
    const arr = COMMENTS.lead;
    setComment(arr[Math.floor(Math.random()*arr.length)](leader));
    commentCD = 90;
  }
}

// ─── MAIN LOOP ────────────────────────────────────────────────────
function getRanked() {
  return [...runners].sort((a,b)=>b.x-a.x);
}

function animate() {
  if (raceFinished) return;
  frameN++;

  runners.forEach(updateRunner);
  checkObstacles();

  // Clean up finished effects
  effects = effects.filter(e => e.frame < e.maxFrame);

  // Camera follows median-ish position
  const active = runners.filter(r=>!r.finished);
  const leadX = active.length ? Math.max(...active.map(r=>r.x)) : FINISH_POS;
  const targetCam = leadX - VIEW_W * 0.6;
  cameraX += (targetCam - cameraX) * 0.08;
  cameraX = Math.max(0, Math.min(cameraX, TRACK_LENGTH - VIEW_W));

  // Draw all lanes
  runners.forEach(r => drawLane(r, cameraX));

  // Progress bars
  runners.forEach(r => {
    r.pbFill.style.width = Math.min(100, (r.x / FINISH_POS) * 100).toFixed(1) + '%';
  });

  // Rank labels
  const ranked = getRanked();
  ranked.forEach((r,i) => {
    if (!r.finished) r.rankEl.textContent = ['1st','2nd','3rd','4th','5th','6th'][i];
  });

  updateCommentary();

  if (runners.every(r=>r.finished)) {
    raceFinished = true;
    showWinner();
    return;
  }

  animFrameId = requestAnimationFrame(animate);
}

function showWinner() {
  const winner = runners.find(r=>r.finishRank===1);
  const isYours = picked !== null && winner.index === picked;
  const banner = document.getElementById('winner-banner');
  banner.style.background = `linear-gradient(135deg,${winner.color}bb,${winner.color}33)`;
  banner.style.border = `3px solid ${winner.color}`;
  banner.style.display = 'block';
  const order = [...runners].sort((a,b)=>a.finishRank-b.finishRank);
  banner.innerHTML = `
    🏆 ${winner.emoji} <span style="color:${winner.color}">${winner.name}</span> WINS!
    ${isYours?'<br><span style="font-size:1rem;color:#F59E0B">🎉 YOUR PICK WON! CALLED IT!</span>':''}
    <br><span style="font-size:0.78rem;opacity:0.6;">${order.map(r=>r.emoji+' '+r.name).join(' → ')}</span>`;
  setComment(isYours
    ? `🏆 ${winner.emoji} ${winner.name} WINS and that was YOUR PICK!! INCREDIBLE!!`
    : `🏆 ${winner.emoji} ${winner.name} survives the chaos and WINS!`);
  launchConfetti(winner.color);
}

function launchConfetti(c) {
  const container = document.getElementById('confetti-container');
  container.innerHTML = '';
  const colors=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316',c,'#fff'];
  for(let i=0;i<140;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(6+Math.random()*8)+'px';
    p.style.height=(6+Math.random()*8)+'px';
    p.style.borderRadius=Math.random()>0.5?'50%':'2px';
    p.style.animationDuration=(1.5+Math.random()*2.5)+'s';
    p.style.animationDelay=(Math.random()*0.8)+'s';
    container.appendChild(p);
  }
  setTimeout(()=>{ container.innerHTML=''; },4500);
}

// ─── CONTROLS ─────────────────────────────────────────────────────
function startRace() {
  if (raceStarted) return;
  raceStarted = true;
  document.getElementById('startBtn').disabled = true;
  if (!audioCtx) try { audioCtx=new(window.AudioContext||window.webkitAudioContext)(); } catch(e){}

  let count=3;
  const cd=document.getElementById('countdown');
  cd.textContent=count; beep(440,0.2);
  const iv=setInterval(()=>{
    count--;
    if(count===0){
      cd.textContent='GO!! 💥'; clearInterval(iv);
      beep(880,0.3);
      setTimeout(()=>{ cd.textContent=''; },700);
      setComment('🏁 THEY\'RE OFF!! And it\'s already complete CHAOS!!');
      animFrameId=requestAnimationFrame(animate);
    } else {
      cd.textContent=count; beep(440,0.2);
    }
  },800);
}

function resetRace() {
  cancelAnimationFrame(animFrameId);
  raceStarted=false; raceFinished=false; frameN=0;
  commentCD=0; cameraX=0;
  document.getElementById('countdown').textContent='';
  document.getElementById('winner-banner').style.display='none';
  document.getElementById('startBtn').disabled=false;
  document.getElementById('confetti-container').innerHTML='';
  buildTrack();
  setComment(picked!==null
    ? `Still on ${RUNNERS_DEF[picked].emoji} ${RUNNERS_DEF[picked].name}? The chaos awaits! 💥`
    : 'Pick your stickman and smash START! 💥');
}

// ─── INIT ─────────────────────────────────────────────────────────
buildPicks();
buildTrack();
</script>
